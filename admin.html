<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Al Hazari Itinerary Builder</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #17211f; }
.container { max-width: 800px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
h2 { color: #075e54; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
h3 { color: #075e54; background: #f5faf8; padding: 10px; border-left: 4px solid #d4a017; margin-top: 25px; }
label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px; }
input, select, textarea { width: 100%; padding: 9px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; font-size: 14px; box-sizing: border-box; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.col { flex: 1; min-width: 140px; }
.btn { background: #25D366; color: #fff; border: none; padding: 14px 25px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; }
.output-box { margin-top: 25px; padding: 20px; background: #e8f5e9; border: 2px solid #c8e6c9; border-radius: 8px; display: none; }
code { display: block; background: #333; color: #fff; padding: 15px; margin-top: 10px; border-radius: 5px; word-wrap: break-word; white-space: pre-wrap; max-height: 200px; overflow-y: auto; font-size: 12px; }
</style>
</head>
<body>

<div class="container">
    <h2>Al Hazari Itinerary Builder (Test)</h2>

    <h3>1. Client Details</h3>
    <div class="row">
        <div class="col"><label>Client Name *</label><input type="text" id="clientName" placeholder="e.g. Test Sharma"></div>
        <div class="col"><label>Adults</label><input type="number" id="adults" value="2"></div>
    </div>
    <div class="row">
        <div class="col"><label>Start Date *</label><input type="date" id="startDate"></div>
        <div class="col"><label>End Date *</label><input type="date" id="endDate"></div>
    </div>

    <h3>2. Package</h3>
    <select id="packageSelect">
        <option value="charming">Charming Kashmir (3N/4D)</option>
        <option value="explorer">Kashmir Explorer (4N/5D)</option>
        <option value="amazing">Amazing Kashmir (5N/6D)</option>
        <option value="heaven">Kashmir Heaven on Earth (6N/7D)</option>
        <option value="honeymoon">Kashmir Honeymoon Special (5N/6D)</option>
    </select>

    <button class="btn" onclick="generate()">GENERATE ITINERARY CODE</button>

    <div class="output-box" id="outputBox">
        <h3 style="background:none; border:none; padding:0; color:#2e7d32;">✅ Itinerary Generated!</h3>
        <p><strong>Step 1:</strong> Copy the JSON code below.</p>
        <p><strong>Step 2:</strong> Create a file in GitHub named: <code id="fileName" style="display:inline; padding:2px 8px; font-size:13px;">client.json</code></p>
        <p><strong>Step 3:</strong> Paste the code into that file and save.</p>
        <p><strong>Step 4:</strong> Send this link to your client:</p>
        <p><a id="clientLink" href="#" target="_blank" style="color:blue; font-weight:bold; word-break:break-all;"></a></p>
        <p><strong>JSON Data:</strong></p>
        <code id="jsonOutput"></code>
    </div>
</div>

<script>
function generate() {
    var clientName = document.getElementById('clientName').value.trim();
    var startDate = document.getElementById('startDate').value;
    var endDate = document.getElementById('endDate').value;

    if (!clientName || !startDate || !endDate) {
        alert("Please fill in Client Name, Start Date, and End Date.");
        return;
    }

    var formatDate = function(d) {
        if (!d) return "";
        var dt = new Date(d);
        return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    };

    var pkg = document.getElementById('packageSelect').value;

    var packages = {
        charming: { title: "Charming Kashmir (3N/4D)", days: 4 },
        explorer: { title: "Kashmir Explorer (4N/5D)", days: 5 },
        amazing: { title: "Amazing Kashmir (5N/6D)", days: 6 },
        heaven: { title: "Kashmir Heaven on Earth (6N/7D)", days: 7 },
        honeymoon: { title: "Kashmir Honeymoon Special (5N/6D)", days: 6 }
    };

    var data = {
        client: clientName,
        adults: document.getElementById('adults').value,
        dates: formatDate(startDate) + " - " + formatDate(endDate),
        packageName: packages[pkg].title,
        totalDays: packages[pkg].days
    };

    var fileName = clientName.toLowerCase().replace(/\s+/g, '-') + ".json";
    
    document.getElementById('outputBox').style.display = 'block';
    document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);
    document.getElementById('fileName').textContent = fileName;
    
    var baseURL = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
    var link = baseURL + "/itinerary.html?file=" + fileName;
    document.getElementById('clientLink').href = link;
    document.getElementById('clientLink').textContent = link;

    navigator.clipboard.writeText(JSON.stringify(data, null, 2));
    alert("JSON copied to clipboard!");
}
</script>

</body>
</html>
